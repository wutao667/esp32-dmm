[platformio]
default_envs = cores3

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.28
    m5stack/M5GFX@0.3.0
    tzapu/WiFiManager@2.0.17

[env:cores3]
board = m5stack-cores3
build_flags = -DMETER_BOARD_CORES3

[env:atoms3r]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/atoms3r.csv
build_flags =
    -DMETER_BOARD_ATOMS3R
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:sticks3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions/atoms3r.csv
build_flags =
    -DMETER_BOARD_STICKS3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
